name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -r requirements-demo-lock.txt
      - name: Install pinned Daytona live dependency
        run: python -m pip install -r requirements-live.txt
      - name: Smoke-import pinned Daytona SDK without credentials
        run: |
          env -u DAYTONA_API_KEY -u DAYTONA_API_URL python - <<'PY'
          import importlib.metadata
          import os

          from daytona import CreateSandboxFromSnapshotParams, Daytona
          from orbit_guard.daytona_rl import runtime_status

          assert "DAYTONA_API_KEY" not in os.environ
          assert "DAYTONA_API_URL" not in os.environ
          assert importlib.metadata.version("daytona") == "0.207.0"
          assert Daytona is not None
          assert CreateSandboxFromSnapshotParams is not None
          assert runtime_status() == {
              "sdk_installed": True,
              "sdk_version": "0.207.0",
              "version_compatible": True,
              "credential_present": False,
              "api_url_overridden": False,
              "ready": False,
          }
          PY
      - name: Compile Python sources
        run: python -m compileall -q app.py src
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test the visual server
        run: |
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/orbitguard-streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep --quiet '^ok$'; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/orbitguard-streamlit.log
              exit 1
            fi
            sleep 0.5
          done
          cat /tmp/orbitguard-streamlit.log
          exit 1
      - name: Verify deterministic demo and fallback exports
        run: python -m orbit_guard.demo --check
      - name: Verify committed fallback exports are current
        run: git diff --exit-code -- artifacts/demo_result.json artifacts/committee_brief.md
      - name: Verify visual fallback pack is present
        run: |
          test -s artifacts/orbit-guard-public-catalogue.png
          test -s artifacts/orbit-guard-public-globe.png
          test -s artifacts/orbit-guard-public-screen.png
          test -s artifacts/orbitguard_alert_fallback.jpg
          test -s artifacts/orbitguard_options_fallback.jpg
          test -s artifacts/orbitguard_committee_fallback.jpg
